<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 01: Trang thơ Bốn mùa</title>
    <style>
        :root {
            --bg-page: #FFFDE7;      
            --border-color: #9E9E9E;  
            --title-bg: #FFD9E6;     
            --title-color: #D40000;   
            --blue-color: #0033CC;    
            --red-color: #D40000;     
        }
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .khung-tho {
            width: 640px;
            padding: 24px;
            background-color: var(--bg-page);
            border: 1px solid var(--border-color);
            text-align: center;
            box-sizing: border-box;
        }

        .khung-tho h1 {
            color: var(--title-color);
            background-color: var(--title-bg);
            font-size: 26px;
            padding: 6px 0;
            margin: 0 0 20px 0;
            text-align: center;
            text-transform: uppercase;
        }
        .khung-tho p {
            font-style: italic;
            line-height: 1.7;
            margin: 0 0 15px 0;
        }
        .kho-xanh {
            color: var(--blue-color);
        }
        .kho-do {
            color: var(--red-color);
        }
        .khung-tho hr {
            width: 55%;
            border: none;
            border-top: 1px solid var(--blue-color);
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <article class="khung-tho">
        <h1>BỐN MÙA</h1>

        <p class="kho-xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>
        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho-xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </article>

</body>
</html>
